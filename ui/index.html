<!DOCTYPE html>
<html>
<head>
  <title>Lumen Station UI</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 1rem; }
    .search-form { margin-bottom: 2rem; padding: 1rem; border: 1px solid #ddd; border-radius: 4px; }
    .results { margin-top: 2rem; }
    .result-item { margin: 0.5rem 0; }
    .result-name { font-weight: bold; }
    .result-url { word-break: break-all; color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Lumen Station</h1>

  <div class="search-form">
    <form id="search-form">
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" required autocomplete="off">
      <button type="submit">Search</button>
    </form>
  </div>

  <div class="results" id="results"></div>

  <script>
    const form = document.getElementById("search-form");
    const resultsDiv = document.getElementById("results");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value;
      resultsDiv.innerHTML = "<p>Searching...</p>";

      try {
        const response = await fetch(`/search?username=${encodeURIComponent(username)}`);
        const data = await response.json();
        resultsDiv.innerHTML = "";

        if (data.sites && data.sites.length > 0) {
          data.sites.forEach(site => {
            const div = document.createElement("div");
            div.className = "result-item";
            const name = document.createElement("span");
            name.className = "result-name";
            name.textContent = site.name;
            const link = document.createElement("a");
            link.className = "result-url";
            link.href = site.url;
            link.target = "_blank";
            link.textContent = site.url;
            div.appendChild(name);
            div.appendChild(document.createTextNode(": "));
            div.appendChild(link);
            resultsDiv.appendChild(div);
          });
        } else {
          resultsDiv.innerHTML = "<p>No results found.</p>";
        }
      } catch (err) {
        resultsDiv.innerHTML = `<p style="color: red;">Error: ${err.message}</p>`;
      }
    });
  </script>
</body>
</html>
